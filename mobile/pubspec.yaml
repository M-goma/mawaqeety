name: mawaqeety
description: "مواقيتي – مواقيت الصلاة والأذان والقرآن الكريم وقصص الأنبياء"
publish_to: 'none'
version: 1.26.0+44

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  http: ^1.6.0
  intl: ^0.20.2
  hijri: ^3.0.1
  flutter_tts: ^4.2.5
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  in_app_update: ^5.0.0
  home_widget: ^0.9.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  archive: ^4.7.1
  share_plus: ^13.3.1
  file_picker: ^13.4.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/quran.json
    - assets/data/mushaf.json
    - assets/data/mushaf_ayahs.json
    - assets/data/prophets.json
    - assets/data/cities.json
    - assets/data/adhan_voices.json
    - assets/data/reciters.json
    - assets/data/story_audio.json
    - assets/data/duas.json
    - assets/data/hadith_bukhari.json.gz
    - assets/data/hadith_muslim.json.gz
    - assets/data/companions.json
    - assets/data/ghazawat.json
    - assets/data/tafsir_muyassar.json.gz
    - assets/data/asbab.json
    - assets/data/fiqh.json
    - assets/data/arbaeen.json
    - assets/data/quiz.json
    - assets/data/seerah.json
    - assets/data/hajj.json
    - assets/images/logo.png
    - assets/sounds/chime.wav
    - assets/sounds/alerts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
