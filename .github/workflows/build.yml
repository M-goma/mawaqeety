name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test --project tests/Mawaqeety.Tests/Mawaqeety.Tests.csproj -c Release
      - name: Build installer
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.0" }
          ./installer/build.ps1 -Version $v -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: Mawaqeety-installer
          path: Releases/*
