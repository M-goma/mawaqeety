name: story-audio
# Stores narrated story files (made with ElevenLabs) in the "stories-audio" release.
# Input: JSON object {"<file name>.mp3": "<temporary download URL>", ...}
on:
  workflow_dispatch:
    inputs:
      files:
        description: "JSON map of file name -> URL"
        required: true

permissions:
  contents: write

jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - name: Download and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          gh release view stories-audio --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create stories-audio --repo "$GITHUB_REPOSITORY" --title "Prophet stories audio" \
              --notes "Narrated stories used by the mobile app." --latest=false
          mkdir out
          echo "$FILES" | jq -r 'to_entries[] | "\(.key)\t\(.value)"' | while IFS=$'\t' read -r name url; do
            case "$name" in *[!A-Za-z0-9._-]*) echo "bad name $name"; exit 1;; esac
            curl -fsSL --retry 3 -o "out/$name" "$url"
            test "$(stat -c%s "out/$name")" -gt 10000
            echo "ok $name $(stat -c%s "out/$name")"
          done
          gh release upload stories-audio out/*.mp3 --repo "$GITHUB_REPOSITORY" --clobber
