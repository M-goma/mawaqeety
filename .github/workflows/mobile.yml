name: mobile
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: mobile

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      PLAY_UPLOAD: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Release signing key (from repository secrets, if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
            printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$STORE_PW" "$KEY_ALIAS" "$KEY_PW" > android/key.properties
            echo "Using release signing key"
          else
            # Never publish an APK signed with a throw-away key: it could not be updated in place later.
            echo "::error::Signing secrets missing (ANDROID_KEYSTORE_BASE64 ...). See docs/GOOGLE_PLAY.md"
            exit 1
          fi
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Build Google Play bundle (AAB)
        run: |
          if [ -f android/key.properties ]; then
            flutter build appbundle --release --build-number=${{ github.run_number }}
            cp build/app/outputs/bundle/release/app-release.aab build/Mawaqeety-play.aab
          else
            echo "::warning::Google Play bundle skipped: add the ANDROID_* signing secrets (see docs/GOOGLE_PLAY.md)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Mawaqeety-google-play-aab
          path: mobile/build/Mawaqeety-play.aab
          if-no-files-found: ignore
      - name: Upload to Google Play (internal testing) automatically
        # Needs the PLAY_SERVICE_ACCOUNT_JSON secret (see docs/GOOGLE_PLAY.md, "automatic upload").
        # Play then offers the update to everyone who installed the app from Play.
        if: env.PLAY_UPLOAD == 'true' && hashFiles('mobile/build/Mawaqeety-play.aab') != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mawaqeety.app
          releaseFiles: mobile/build/Mawaqeety-play.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
      - name: Publish the Google Play bundle to the "play-latest" release
        if: hashFiles('mobile/build/Mawaqeety-play.aab') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: play-latest
          name: "Google Play bundle (AAB)"
          body: |
            ملف Mawaqeety-play.aab للرفع على Google Play Console (موقّع بمفتاح الرفع).
            لا يُثبَّت مباشرة على الهاتف؛ للتثبيت المباشر استخدم Mawaqeety.apk.
          make_latest: false
          files: mobile/build/Mawaqeety-play.aab
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/Mawaqeety.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mawaqeety-android
          path: mobile/build/Mawaqeety.apk
      - name: Publish APK to the "mobile-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: "مواقيتي للموبايل – أحدث إصدار"
          body: |
            ملف تثبيت أندرويد: Mawaqeety.apk
            يُحدَّث تلقائيًا مع كل تعديل على تطبيق الموبايل.
          prerelease: false
          make_latest: false
          files: mobile/build/Mawaqeety.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (unsigned – needs an Apple Developer account to install)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ios/iphoneos/Runner.app build/Payload/
          cd build && zip -qr Mawaqeety-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Mawaqeety-ios-unsigned
          path: mobile/build/Mawaqeety-unsigned.ipa

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-web-resources-cdn --base-href /mawaqeety/ --build-number=${{ github.run_number }}
      - run: touch build/web/.nojekyll
      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: mobile/build/web
          publish_branch: gh-pages
          force_orphan: true
