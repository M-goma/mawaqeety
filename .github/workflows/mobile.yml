name: mobile
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    working-directory: mobile

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/Mawaqeety.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mawaqeety-android
          path: mobile/build/Mawaqeety.apk
      - name: Publish APK to the "mobile-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: "مواقيتي للموبايل – أحدث إصدار"
          body: |
            ملف تثبيت أندرويد: Mawaqeety.apk
            يُحدَّث تلقائيًا مع كل تعديل على تطبيق الموبايل.
          prerelease: false
          make_latest: false
          files: mobile/build/Mawaqeety.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (unsigned – needs an Apple Developer account to install)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ios/iphoneos/Runner.app build/Payload/
          cd build && zip -qr Mawaqeety-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Mawaqeety-ios-unsigned
          path: mobile/build/Mawaqeety-unsigned.ipa

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-web-resources-cdn --base-href /mawaqeety/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web
      - id: deploy
        uses: actions/deploy-pages@v4
