name: verify-audio
# Checks that every reciter folder on everyayah.com serves real MP3 files
# (first and last ayah of the mushaf). Runs on GitHub because some hosts are not reachable elsewhere.
on:
  push:
    branches: [main]
    paths: ["mobile/assets/data/reciters.json", ".github/workflows/verify-audio.yml", "tools/verify_audio.py"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check reciter URLs
        run: python3 tools/verify_audio.py
